# Test configuration for gateway MCP integration tests
# Uses file:// registry with short refresh for testing

registry:
  # Use $PWD or absolute path when running gateway
  source: file:///home/user/agentgatewaygastown/registry-service/data/test-registry.json
  refreshInterval: 1s  # Short interval for testing

binds:
  - port: 3000
    listeners:
      - routes:
          - policies:
              cors:
                allowOrigins:
                  - "*"
                allowHeaders:
                  - mcp-protocol-version
                  - content-type
                  - cache-control
                exposeHeaders:
                  - "Mcp-Session-Id"
            backends:
              - mcp:
                  targets:
                    # HTTP backend that's not running - will fail quickly
                    # This allows testing virtual tools without a real backend
                    - name: dummy-backend
                      mcp:
                        host: http://localhost:19999/mcp
