[project]
name = "research-assistant-demo"
version = "0.1.0"
description = "Research Assistant demo showcasing virtual tools for distributed microservices"
requires-python = ">=3.10"
dependencies = [
    # MCP services
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.2.0",
    "sqlite-vec>=0.1.1",
    "aiosqlite>=0.19.0",

    # HTTP client for external APIs
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",

    # Web UI and A2A server
    "python-fasthtml>=0.4.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",

    # Agent framework
    "google-adk[extensions]>=1.27.0",

    # LLM providers (configurable)
    "litellm>=1.82.0",
    "anthropic>=0.76.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
